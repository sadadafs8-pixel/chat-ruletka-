<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CLIENTA QA</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head h1{margin:0;font-size:28px}.pill{border:1px solid #333;border-radius:999px;padding:8px 12px;font-weight:800}.ok{background:#17391f}.bad{background:#4b1c1c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.card{border:1px solid #2c2c2c;border-radius:18px;padding:16px;background:#131313}.row{display:flex;gap:10px;padding:9px 0;border-top:1px solid #242424}.row:first-child{border-top:0}.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}.dot.ok{background:#6ee787}.dot.bad{background:#ff7b72}.row b{display:block}.row small{display:block;color:#999;margin-top:3px}.frame{margin-top:18px;border:1px solid #2c2c2c;border-radius:18px;overflow:hidden;background:#fff}.frame iframe{width:100%;height:720px;border:0}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.frame iframe{height:680px}}</style></head><body><div class="wrap"><div class="head"><h1>CLIENTA QA</h1><span id="summary" class="pill">Запуск…</span></div><div class="grid"><section class="card"><h2>Renderer / данные</h2><div id="logic"></div></section><section class="card"><h2>UX / mobile</h2><div id="ux"></div></section></div><div class="frame"><iframe id="app" src="./index.html" title="CLIENTA under test"></iframe></div></div><script>
const $=id=>document.getElementById(id),tests=[];function add(group,name,ok,details=''){tests.push({group,name,ok:!!ok,details})}function render(){for(const g of ['logic','ux']){$(g).innerHTML=tests.filter(t=>t.group===g).map(t=>`<div class="row"><span class="dot ${t.ok?'ok':'bad'}"></span><div><b>${t.name}</b><small>${t.details|| (t.ok?'OK':'FAIL')}</small></div></div>`).join('')}const f=tests.filter(t=>!t.ok);$('summary').className='pill '+(f.length?'bad':'ok');$('summary').textContent=f.length?`${f.length} ошибок`:'Все проверки пройдены'}
function run(){tests.length=0;const w=$('app').contentWindow,d=w.document;try{const q=w.CLIENTA_QA||w.qa?.();add('logic','Встроенный QA',q?.ok,JSON.stringify(q||{}));add('logic','40+ бизнес-сценариев',Array.isArray(w.BUSINESSES)&&w.BUSINESSES.length>=40,`businesses=${w.BUSINESSES?.length}`);add('logic','10 тем',w.THEMES?.length===10,`themes=${w.THEMES?.length}`);add('logic','8 шрифтов',w.FONTS?.length===8,`fonts=${w.FONTS?.length}`);const base={name:'QA MAX',biz:'QA',bizCat:'Другое',theme:0,font:1,pack:'max',mods:[...w.PACKS.max],services:[['Тест','30 минут','1 ₽']],schedule:'10:00–20:00',contact:'@qa',channels:['Web']};const html=w.clientMarkup(base,true);const req=['МАКСИМУМ','AI-ассистент','Сертификат','Лист ожидания','4 / 8','Отзывы · 4.9','Повторить','с предоплатой'];add('logic','Максимум рендерит ключевые модули',req.every(x=>html.includes(x)),req.filter(x=>!html.includes(x)).join(', ')||'все маркеры есть');const no=w.normalizeProject({...base,pack:'custom',mods:['Лояльность']});const nh=w.clientMarkup(no,true);add('logic','Выключенная онлайн-запись не протекает в UI',!nh.includes('data-act="booking"'),'booking actions должны отсутствовать');const dep=w.normalizeProject({...base,pack:'custom',mods:['Предоплата']});add('logic','Предоплата автоматически включает запись',dep.mods.includes('Онлайн-запись'),dep.mods.join(', '));add('logic','Нет inline onclick в renderer',!/onclick=/.test(html),'data-act + addEventListener');const tmp=d.createElement('div');w.mountClient(tmp,base,true);add('logic','1:1 renderer интерактивен',tmp.querySelectorAll('[data-act]').length>=12,`${tmp.querySelectorAll('[data-act]').length} действий`);const touch=[...d.querySelectorAll('button')].filter(b=>b.offsetParent!==null),tiny=touch.filter(b=>{const r=b.getBoundingClientRect();return r.height<38||r.width<38});add('ux','Touch-зоны кнопок',tiny.length===0,`${tiny.length} маленьких из ${touch.length}`);add('ux','Есть мобильное 1:1 превью',!!d.getElementById('mobilePreview')&&!!d.getElementById('mobilePreviewBtn'),'preview modal + trigger');add('ux','Launch Setup имеет 5 проверок',!!d.getElementById('launchGrid'),'услуги / график / контакт / функции / каналы');add('ux','iPhone visualViewport учтён','visualViewport' in w,'keyboard resize path');add('ux','Референс можно добавить',!!d.getElementById('reference')&&d.getElementById('reference').type==='file','file input присутствует')}catch(e){add('logic','QA harness exception',false,e.stack||String(e))}render()}
$('app').addEventListener('load',()=>setTimeout(run,450));
</script></body></html>
