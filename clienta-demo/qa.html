<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CLIENTA QA</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#0b0b0b;color:#fff}.wrap{max-width:980px;margin:auto;padding:24px}.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.head h1{margin:0;font-size:28px}.pill{border:1px solid #333;border-radius:999px;padding:8px 12px;font-weight:800}.ok{background:#17391f}.bad{background:#4b1c1c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.card{border:1px solid #2c2c2c;border-radius:18px;padding:16px;background:#131313}.card h2{margin:0 0 10px;font-size:17px}.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #242424}.row:first-child{border-top:0}.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}.dot.ok{background:#6ee787}.dot.bad{background:#ff7b72}.row b{display:block}.row small{display:block;color:#999;margin-top:3px;line-height:1.35}.frame{margin-top:18px;border:1px solid #2c2c2c;border-radius:18px;overflow:hidden;background:#fff}.frame iframe{width:100%;height:720px;border:0;display:block}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.frame iframe{height:680px}}</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>CLIENTA QA</h1><span id="summary" class="pill">Запуск…</span></div>
  <div class="grid"><section class="card"><h2>Renderer / данные</h2><div id="logic"></div></section><section class="card"><h2>UX / mobile</h2><div id="ux"></div></section></div>
  <div class="frame"><iframe id="app" src="./index.html" title="CLIENTA under test"></iframe></div>
</div>
<script>
const $=id=>document.getElementById(id);let tests=[];
function add(group,name,ok,details=''){tests.push({group,name,ok:!!ok,details})}
function render(){for(const group of ['logic','ux']){$(group).innerHTML=tests.filter(t=>t.group===group).map(t=>`<div class="row"><span class="dot ${t.ok?'ok':'bad'}"></span><div><b>${t.name}</b><small>${t.details|| (t.ok?'OK':'FAIL')}</small></div></div>`).join('')}const fails=tests.filter(t=>!t.ok);$('summary').className='pill '+(fails.length?'bad':'ok');$('summary').textContent=fails.length?`${fails.length} ошибок`:`Все проверки пройдены`}
function run(){tests=[];const w=$('app').contentWindow,d=w.document;try{
 add('logic','Встроенный QA',w.CLIENTA_QA?.ok,JSON.stringify(w.CLIENTA_QA||{}));
 add('logic','10 тем',Array.isArray(w.THEMES)&&w.THEMES.length===10,`themes=${w.THEMES?.length}`);
 add('logic','8 шрифтов',Array.isArray(w.FONTS)&&w.FONTS.length===8,`fonts=${w.FONTS?.length}`);
 add('logic','35+ бизнесов',Array.isArray(w.BUSINESSES)&&w.BUSINESSES.length>=35,`businesses=${w.BUSINESSES?.length}`);
 const base={name:'QA MAX',biz:'QA',bizCat:'Другое',theme:0,font:1,pack:'max',mods:[...w.PACKS.max],services:[['Тест','30 минут','1 ₽']],schedule:'10:00–20:00',contact:'@qa',channels:['Web']};
 const html=w.clientMarkup(base,true);
 const required=['МАКСИМУМ','AI-ассистент','Сертификаты','Лист ожидания','Абонементы','Отзывы · 4.9','Повторная запись','с предоплатой'];
 add('logic','Максимум рендерит все ключевые client-модули',required.every(x=>html.includes(x)),required.filter(x=>!html.includes(x)).join(', ')||'все маркеры есть');
 const startHtml=w.clientMarkup({...base,pack:'start',mods:[...w.PACKS.start]},true);
 add('logic','Старт не протекает функциями Максимума',!startHtml.includes('AI-ассистент')&&!startHtml.includes('Сертификаты')&&!startHtml.includes('Абонементы'),'проверка изоляции пакетов');
 const ta=d.getElementById('services');if(ta){const old=ta.value;ta.value='A | 10 мин | 100 ₽\nB | 20 мин | 200 ₽';const parsed=w.servicesFromText();ta.value=old;add('logic','Парсер услуг понимает строки',parsed.length===2&&parsed[1][0]==='B',JSON.stringify(parsed))}else add('logic','Парсер услуг понимает строки',false,'textarea #services не найден');
 const legacy=w.normalizeProject({name:'Legacy',biz:'QA',bizCat:'Другое',mods:w.PACKS.max,services:[['A','1','1']]});add('logic','Legacy-проект определяется как Максимум',w.planOf(legacy)==='max',`plan=${w.planOf(legacy)}`);
 add('logic','Preview и public используют один renderer',typeof w.clientMarkup==='function'&&typeof w.renderPublic==='function','clientMarkup() используется для 1:1 preview/public');
 const preview=d.querySelector('.projectPreview');const pe=preview?getComputedStyle(preview).pointerEvents:'n/a';add('ux','Карточки проектов не перехватывают клики внутри thumbnail',!preview||pe==='none',`pointer-events=${pe}; интерактивность должна быть только через «Открыть»`);
 const touch=[...d.querySelectorAll('button')].filter(b=>b.offsetParent!==null);const tiny=touch.filter(b=>{const r=b.getBoundingClientRect();return r.height<38||r.width<38});add('ux','Видимые кнопки имеют достаточную touch-зону',tiny.length===0,`${tiny.length} слишком маленьких из ${touch.length}`);
 add('ux','Мобильное 1:1 превью существует',!!d.getElementById('mobilePreview')&&!!d.querySelector('.mobilePreviewBtn'),'mobilePreview + trigger');
 add('ux','iPhone keyboard использует visualViewport',typeof w.keyboard==='function'&&'visualViewport' in w,'keyboard() + visualViewport');
 add('ux','Launch Setup имеет редактируемые действия',typeof w.quickEdit==='function'&&!!d.getElementById('launchGrid'),'quickEdit(step)');
 }catch(e){add('logic','QA harness exception',false,e.stack||String(e))}render()}
$('app').addEventListener('load',()=>setTimeout(run,250));
</script>
</body>
</html>
