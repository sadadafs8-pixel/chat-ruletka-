<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Финансы</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="enhancements.css" />
</head>
<body>
  <div class="lock" id="lockScreen">
    <div class="lock-top"><div class="mini-badge">ID</div></div>
    <div class="lock-center">
      <h1 id="lockGreeting">Здравствуйте, Александр!</h1>
      <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="keypad" id="keypad">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button class="skip" id="skipPin">Пропустить</button><button data-key="0">0</button><button class="erase" id="erasePin">⌫</button>
    </div>
  </div>

  <div class="app" id="app">
    <main class="screen active" id="screenHome">
      <section class="hero-row">
        <button class="profile-open" id="profileBtn">
          <div class="avatar">А</div>
          <div class="profile-name">Александр <span>›</span></div>
        </button>
        <button class="gift-btn" data-panel="gifts">🎁</button>
      </section>

      <button class="search-bar" id="searchBtn"><span>⌕</span><b>Поиск</b></button>

      <section class="summary-grid">
        <button class="summary-card" id="historyTile">
          <h3>Все операции</h3>
          <p>Трат в августе</p>
          <strong id="spendTile">130 607 ₽</strong>
          <div class="segments"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </button>
        <button class="summary-card" id="cashbackTile">
          <h3>Кэшбэк<br>и бонусы</h3>
          <div class="bonus-icons"><span>↗</span><span>▣</span><span>М</span></div>
        </button>
      </section>

      <section class="quick-actions">
        <button data-action="transfer"><span>↗</span><b>Перевести<br>по телефону</b></button>
        <button data-action="topup"><span>＋</span><b>Пополнить<br><em id="quickAccountName">Black</em></b></button>
        <button data-action="between"><span>⇄</span><b>Между<br>счетами</b></button>
        <button data-action="qr"><span>⌗</span><b>Сканировать<br>QR-код</b></button>
      </section>

      <button class="account-card" id="accountCard">
        <div class="account-icon">₽</div>
        <div class="account-main">
          <div class="account-title"><strong id="balanceText">13,84 ₽</strong><span>0 ₽</span></div>
          <p id="accountName">Black</p>
          <div class="mini-card"><span>••••</span><b id="cardLast4">8310</b></div>
          <div class="topup-wide" data-action="topup"><span>＋</span> Пополнить из другого банка <b>›</b></div>
        </div>
      </button>

      <section class="promo-card">
        <div><h3>Удвоим<br>ваши пожертвования</h3><p>Поддержите благотворительные проекты</p></div>
        <button id="closePromo">×</button>
        <div class="promo-art"><span>×2</span></div>
      </section>

      <div id="goalList"></div>

      <section class="product-grid">
        <button class="product-card tall" data-panel="save"><h3>Копить</h3><div class="safe-art">↑</div></button>
        <button class="product-card" data-panel="invest"><h3>Инвести-<br>ции от 10 ₽</h3><div class="bars-art"><i></i><i></i><i></i><i></i></div></button>
        <button class="product-card" data-panel="sim"><h3>Сим-карта</h3><div class="sim-art">▣</div></button>
        <button class="product-card tall" data-panel="entertainment"><h3>🎧 и 🎬 с кэшб-<br>эком</h3><div class="film-art">◉</div></button>
        <button class="product-card yellow" data-panel="products"><h3>Все про-<br>дукты</h3><div class="bag-art">▱</div></button>
      </section>

      <h2 class="home-auto-title">Дом и авто</h2>
      <section class="home-auto-grid">
        <button class="home-card" data-panel="home"><span>＋ Дом</span><div class="house-art">⌂</div></button>
        <button class="home-card" data-panel="car"><span>＋ Авто</span><div class="car-art">▰</div></button>
      </section>
    </main>

    <main class="screen" id="screenPayments">
      <header class="page-head"><h1>Платежи</h1><p>Быстрые действия</p></header>
      <section class="list-card">
        <button data-action="transfer"><span>↗</span><div><b>Перевести</b><small>По номеру телефона</small></div><em>›</em></button>
        <button data-action="topup"><span>＋</span><div><b>Пополнить</b><small>Основной счёт</small></div><em>›</em></button>
        <button data-action="between"><span>⇄</span><div><b>Между счетами</b><small>Основной и накопительные</small></div><em>›</em></button>
        <button data-action="qr"><span>⌗</span><div><b>По QR-коду</b><small>Камера и платежная ссылка</small></div><em>›</em></button>
        <button data-panel="services"><span>▦</span><div><b>Услуги</b><small>Связь, интернет, ЖКХ</small></div><em>›</em></button>
      </section>
    </main>

    <main class="screen" id="screenCity">
      <header class="page-head"><h1>Город</h1><p>Сервисы рядом</p></header>
      <section class="city-grid">
        <button data-panel="cafe"><span>☕</span><b>Кафе</b></button><button data-panel="cinema"><span>🎬</span><b>Кино</b></button>
        <button data-panel="taxi"><span>🚕</span><b>Такси</b></button><button data-panel="shopping"><span>🛍</span><b>Покупки</b></button>
      </section>
    </main>

    <main class="screen" id="screenChat">
      <header class="page-head"><h1>Чат</h1><p>Сообщения</p></header>
      <button class="chat-card" id="supportChat"><div class="chat-avatar">●</div><div><b>Поддержка</b><p>Чем можем помочь?</p></div><span>›</span></button>
    </main>

    <main class="screen" id="screenMore">
      <header class="page-head"><h1>Витрина</h1><p>Настройки интерфейса</p></header>
      <section class="list-card">
        <button id="editAccount"><span>₽</span><div><b>Основной счёт</b><small>Название, баланс и последние цифры</small></div><em>›</em></button>
        <button id="manageGoals"><span>◢</span><div><b>Накопительные счета</b><small>Названия, суммы и цели</small></div><em>›</em></button>
        <button id="resetData"><span>↻</span><div><b>Сбросить данные</b><small>Вернуть исходные значения</small></div><em>›</em></button>
      </section>
      <p class="sim-note">Демо-интерфейс: реальные банковские счета и карты не подключены.</p>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-screen="Home"><span>⌂</span><small>Главная</small></button>
      <button class="nav-item" data-screen="Payments"><span>○</span><small>Платежи</small></button>
      <button class="nav-item" data-screen="City"><span>◆</span><small>Город</small></button>
      <button class="nav-item" data-screen="Chat"><span>▰</span><small>Чат</small><i>9</i></button>
      <button class="nav-item" data-screen="More"><span>▦</span><small>Витрина</small></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" aria-hidden="true"><div class="grabber"></div><div id="sheetContent"></div></div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  <script src="enhancements.js"></script>
</body>
</html>
